{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-danger shadow">
                <div class="card-header bg-danger text-white">
                    <h5 class="mb-0"><i class="bi bi-exclamation-triangle-fill"></i> هشدار حذف</h5>
                </div>
                <div class="card-body text-center p-5">
                    <h4 class="mb-4">آیا از حذف فیلم <span class="fw-bold text-danger">«{{ movie.title }}»</span> مطمئن هستید؟</h4>
                    <p class="text-muted mb-4">این عملیات غیرقابل بازگشت است و تمام سانس‌های مربوط به این فیلم نیز ممکن است حذف شوند.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2">
                            <a href="{% url 'movie_admin_list' %}" class="btn btn-secondary px-4">خیر، منصرف شدم</a>
                            <button type="submit" class="btn btn-danger px-4">بله، حذف کن</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
