{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>ورود به سینما شریف 🎬</h4>
            </div>
            <div class="card-body">
                <p class="text-center text-muted">برای شروع، شماره موبایل خود را وارد کنید</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">ادامه</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
