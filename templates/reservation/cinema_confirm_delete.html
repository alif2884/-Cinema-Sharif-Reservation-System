{% extends "base.html" %}
{% block content %}
<div class="container mt-5 d-flex justify-content-center">
    <div class="card border-danger shadow" style="max-width: 500px;">
        <div class="card-body text-center p-5">
            <i class="bi bi-trash3 text-danger display-1 mb-3"></i>
            <h2 class="h4 mb-3">حذف سینما</h2>
            <p class="mb-4">
                آیا مطمئنید که می‌خواهید سینمای <strong>{{ cinema.name }}</strong> را حذف کنید؟
                <br>
                <span class="text-danger small">تمام سانس‌ها و اطلاعات مربوط به این سینما حذف خواهد شد!</span>
            </p>
            
            <form method="post">
                {% csrf_token %}
                <div class="d-grid gap-2 col-8 mx-auto">
                    <button type="submit" class="btn btn-danger">بله، حذف شود</button>
                    <a href="{% url 'cinema_list' %}" class="btn btn-outline-secondary">بازگشت</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
