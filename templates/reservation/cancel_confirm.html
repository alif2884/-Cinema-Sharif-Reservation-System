{% extends "base.html" %}
{% block content %}
<div class="container mt-5 d-flex justify-content-center">
    <div class="card border-danger shadow-sm" style="max-width: 500px;">
        <div class="card-header bg-danger text-white">
            <h5 class="mb-0"><i class="bi bi-exclamation-triangle-fill"></i> تأیید لغو رزرو</h5>
        </div>
        <div class="card-body text-center">
            <p class="fs-5">آیا مطمئن هستید که می‌خواهید رزرو با کد زیر را لغو کنید؟</p>
            <h3 class="font-monospace text-danger my-3">{{ reservation.tracking_code }}</h3>
            <p class="text-muted small">این عملیات غیرقابل بازگشت است و صندلی شما آزاد خواهد شد.</p>
            
            <form method="post" class="d-flex justify-content-center gap-2 mt-4">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4">بله، لغو کن</button>
                <a href="{% url 'my_reservations' %}" class="btn btn-secondary px-4">انصراف</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
